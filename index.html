<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="How Android really runs, as an explorable 3D city: boot, Zygote fork, Binder, frames, memory pressure and the LMK kill order — all live, all clickable." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thuat.dev/droidcity/" />
    <meta property="og:title" content="DroidCity — how Android runs, as a city you can explore" />
    <meta property="og:description" content="How Android really runs, as an explorable 3D city: boot, Zygote fork, Binder, frames, memory pressure and the LMK kill order — all live, all clickable." />
    <meta property="og:image" content="https://thuat.dev/droidcity/og.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DroidCity — how Android runs, as a city you can explore" />
    <meta name="twitter:description" content="How Android really runs, as an explorable 3D city: boot, Zygote fork, Binder, frames, memory pressure and the LMK kill order — all live, all clickable." />
    <meta name="twitter:image" content="https://thuat.dev/droidcity/og.jpg" />
    <title>DroidCity — how Android runs, as a city you can explore</title>
    <style>
      body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
      #switcher { position: fixed; top: 12px; left: 12px; display: flex; align-items: center; gap: 8px; z-index: 10; }
      #switcher .switcher-divider { width: 1px; height: 20px; background: #d0d7de; margin: 0 2px; }
      #panel { position: fixed; bottom: 12px; left: 12px; max-width: 380px; background: rgba(255,255,255,.9); color: #24292f; padding: 12px 16px; border-radius: 8px; border: 1px solid #d0d7de; z-index: 10; }
      #panel h2 { margin: 0 0 8px; font-size: 16px; }
      .panel-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
      .panel-narration { font-size: 13px; color: #57606a; min-height: 3em; white-space: pre-line; }
      button { background: #f6f8fa; color: #24292f; border: 1px solid #d0d7de; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
      button:hover { background: #eaeef2; }
      button.active { background: #388bfd; color: #fff; }
      #intro { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; background: rgba(233,231,226,.7); color: #24292f; z-index: 20; padding: 24px; }
      .intro-panel { background: rgba(255,255,255,.95); border: 1px solid #d0d7de; border-radius: 12px; padding: 16px 32px 24px; }
      .intro-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      /* The guided tour is the best path through the city — give it the accent. */
      button.primary { background: #3ddc84; border-color: #2bb96c; color: #10281b; font-weight: 700; }
      button.primary:hover { background: #34c877; }
      #intro p { max-width: 480px; color: #57606a; }
      #oom-table { position: fixed; right: 12px; bottom: 12px; background: rgba(255,255,255,.9); border: 1px solid #d0d7de; border-radius: 8px; padding: 8px 12px; font: 11px ui-monospace, monospace; color: #57606a; z-index: 10; pointer-events: none; }
      .oom-title { color: #24292f; font-weight: 600; margin-bottom: 4px; }
      .oom-row { display: flex; gap: 10px; white-space: pre; }
      .oom-row.oom-victim { color: #d1242f; }
      .oom-row.oom-static { color: #8c959f; }
      #intro a, #panel a { color: #0969da; text-decoration: none; }
      #intro a:hover, #panel a:hover { text-decoration: underline; }
      #story-bar { position: fixed; top: 12px; right: 12px; z-index: 10; }
      #story-bar .story-menu { position: absolute; top: 100%; right: 0; margin-top: 6px; background: rgba(255,255,255,.97); border: 1px solid #d0d7de; border-radius: 10px; padding: 8px; display: none; flex-direction: column; gap: 3px; min-width: 232px; box-shadow: 0 8px 24px rgba(31,41,51,.12); }
      #story-bar .story-menu.open { display: flex; }
      #story-bar .story-menu button { text-align: left; border-color: transparent; background: transparent; }
      #story-bar .story-menu button:hover { background: #eef2f6; border-color: #d0d7de; }
      #story-bar .story-menu .menu-head { font: 11px/1.6 ui-monospace, monospace; color: #57606a; padding: 2px 8px 6px; border-bottom: 1px solid #eaeef2; margin-bottom: 4px; }
      #story-bar .story-menu button.primary { background: #3ddc84; border-color: #2bb96c; margin-bottom: 2px; }
      #story-toggle { background: #3ddc84; border-color: #2bb96c; color: #10281b; font-weight: 700; }
      #story-toggle:hover { background: #34c877; }
      #story-card { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); max-width: 560px; width: calc(100% - 24px); background: rgba(255,255,255,.9); color: #24292f; padding: 12px 16px; border-radius: 8px; border: 1px solid #d0d7de; z-index: 10; display: none; }
      #story-card.open { display: block; }
      #story-card h2 { margin: 0 0 8px; font-size: 16px; }
      .story-narration { font-size: 13px; color: #57606a; min-height: 3em; margin: 0 0 8px; }
      .story-progress { font-size: 12px; color: #57606a; margin-bottom: 8px; }
      .story-controls { display: flex; gap: 8px; }
      button.disabled { opacity: .4; pointer-events: none; cursor: not-allowed; }
      #oom-table .oom-sub { font-size: 10px; color: #8b949e; margin: -2px 0 4px; }
      .hud-label { background: rgba(255,255,255,.9); border: 1px solid #d0d7de; border-radius: 6px; padding: 4px 8px; font: 11px/1.5 ui-monospace, monospace; color: #24292f; pointer-events: none; white-space: nowrap; }
      .hud-label-title { font-weight: 700; }
      .hud-label-line { color: #57606a; }
      .hud-ward-label { background: rgba(255,255,255,.9); border: 1px solid #d0d7de; border-radius: 5px; padding: 2px 6px; font: 10px/1.4 ui-monospace, monospace; color: #57606a; pointer-events: none; white-space: nowrap; }
      .hud-ward-label-start { color: #9a6700; font-weight: 700; }
      #inspector-tip { position: fixed; top: 0; left: 0; z-index: 9; display: none; max-width: 260px; background: rgba(255,255,255,.95); border: 1px solid #d0d7de; border-radius: 6px; padding: 6px 10px; font: 11px/1.5 ui-monospace, monospace; color: #24292f; pointer-events: none; }
      #inspector-tip.open { display: block; }
      .inspector-tip-title { font-weight: 700; }
      .inspector-tip-note { color: #57606a; font-size: 12px; margin-top: 2px; }
    </style>
  </head>
  <body>
    <div id="intro">
      <div class="intro-panel">
      <h1>DroidCity</h1>
      <p>A working model of how an Android app runs — as a city. Pick a district up top; press the buttons; watch what the OS does. Early prototype: expect inaccuracies, corrections welcome.</p>
      <p class="intro-links">
        <a href="https://github.com/nthuat/droidcity" target="_blank" rel="noopener">GitHub</a> ·
        <a href="https://github.com/nthuat/droidcity/blob/main/docs/android-flow-reference.md" target="_blank" rel="noopener">Android flow reference</a> ·
        inspired by <a href="https://nikolays.github.io/PGSimCity/" target="_blank" rel="noopener">PGSimCity</a>
      </p>
      <div class="intro-actions">
        <button id="intro-tour" class="primary">▶ Play the 7-chapter tour</button>
        <button id="intro-close">Explore on my own</button>
      </div>
      </div>
    </div>
    <div id="app"></div>
    <div id="switcher"></div>
    <div id="panel"></div>
    <div id="story-bar"></div>
    <div id="story-card"></div>
    <div id="inspector-tip"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
